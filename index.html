<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            word-break: break-word;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }
        .result-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .download-side-btn {
            background-color: #22c55e;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .download-side-btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Video Downloader</h2>
        <form id="downloadForm" onsubmit="startDownload(event)">
            <input type="text" id="urlInput" placeholder="Paste link here..." autocomplete="off">
            <button type="submit" id="downloadBtn">Find Video</button>
        </form>
        <p id="status"></p>

        <!-- Video found container with download button on the right -->
        <div id="resultBox" class="result-box">
            <div class="result-info" id="videoTitle">Video Ready</div>
            <a id="downloadLink" href="#" class="download-side-btn">Download</a>
        </div>
    </div>

    <script>
        const TUNNEL_URL = 'https://gregory-edward-gibson-flash.trycloudflare.com';

        async function startDownload(event) {
            event.preventDefault();

            const urlInput = document.getElementById('urlInput');
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultBox = document.getElementById('resultBox');
            
            const url = urlInput.value.trim();
            if (!url) {
                status.style.color = '#f87171';
                status.innerText = "Please paste a valid URL first.";
                resultBox.style.display = 'none';
                return;
            }

            downloadBtn.disabled = true;
            status.style.color = '#38bdf8';
            status.innerText = "Starting download on server...";
            resultBox.style.display = 'none';

            try {
                // 1. Tell backend to start download thread
                const res = await fetch(`${TUNNEL_URL}/start_download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, format: 'mp4', quality: 'best' })
                });
                const data = await res.json();

                if (!res.ok || data.status !== 'started') {
                    throw new Error(data.message || "Failed to start download.");
                }

                const downloadId = data.download_id;
                
                // 2. Poll for progress
                pollProgress(downloadId);

            } catch (err) {
                status.style.color = '#f87171';
                status.innerText = "Error: " + err.message;
                downloadBtn.disabled = false;
            }
        }

        function pollProgress(downloadId) {
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');
            const downloadLink = document.getElementById('downloadLink');
            const downloadBtn = document.getElementById('downloadBtn');
            const videoTitle = document.getElementById('videoTitle');

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${TUNNEL_URL}/download_status/${downloadId}`);
                    const data = await res.json();

                    if (data.status === 'ready') {
                        clearInterval(interval);
                        status.style.color = '#4ade80';
                        status.innerText = "Video found and processed successfully!";
                        
                        // Set up direct download link on the right side button
                        videoTitle.innerText = data.filename;
                        downloadLink.href = `${TUNNEL_URL}/download_file/${downloadId}`;
                        resultBox.style.display = 'flex';
                        downloadBtn.disabled = false;
                    } else if (data.status === 'error') {
                        clearInterval(interval);
                        status.style.color = '#f87171';
                        status.innerText = "Error: " + data.message;
                        downloadBtn.disabled = false;
                    } else {
                        // Still downloading/processing
                        status.style.color = '#38bdf8';
                        status.innerText = `Downloading... Progress: ${data.progress || '0%'} (Speed: ${data.speed || '?'})`;
                    }
                } catch (e) {
                    clearInterval(interval);
                    status.style.color = '#f87171';
                    status.innerText = "Lost connection while checking progress.";
                    downloadBtn.disabled = false;
                }
            }, 1500);
        }
    </script>

</body>
</html>
