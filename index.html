<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader - 9xbuddy Style</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            word-break: break-word;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: left;
        }
        .video-meta {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }
        .video-meta img {
            width: 120px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
        }
        .video-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #f8fafc;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .formats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .format-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .format-btn {
            background-color: #22c55e;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
        }
        .format-btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Video Downloader</h2>
        <form id="downloadForm" onsubmit="fetchVideoInfo(event)">
            <input type="text" id="urlInput" placeholder="Paste video link here..." autocomplete="off">
            <button type="submit" id="submitBtn">Get Video Info</button>
        </form>
        <p id="status"></p>

        <!-- 9xbuddy Style Result Box -->
        <div id="resultBox" class="result-box">
            <div class="video-meta">
                <img id="videoThumb" src="" alt="Thumbnail">
                <div class="video-title" id="videoTitle">Video Title</div>
            </div>
            <div class="formats-list" id="formatsList">
                <!-- Dynamically injected formats will appear here -->
            </div>
        </div>
    </div>

    <script>
        // REPLACE with your active Cloudflare tunnel URL
        const TUNNEL_URL = 'https://gregory-edward-gibson-flash.trycloudflare.com';

        async function fetchVideoInfo(event) {
            event.preventDefault();

            const urlInput = document.getElementById('urlInput');
            const status = document.getElementById('status');
            const submitBtn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            
            const url = urlInput.value.trim();
            if (!url) {
                status.style.color = '#f87171';
                status.innerText = "Please paste a valid URL first.";
                resultBox.style.display = 'none';
                return;
            }

            submitBtn.disabled = true;
            status.style.color = '#38bdf8';
            status.innerText = "Fetching video details...";
            resultBox.style.display = 'none';

            try {
                const res = await fetch(`${TUNNEL_URL}/info`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await res.json();

                if (!res.ok || data.status !== 'success') {
                    throw new Error(data.message || "Failed to fetch video info.");
                }

                status.style.color = '#4ade80';
                status.innerText = "Video found!";
                
                // Populate metadata
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('videoThumb').src = data.thumbnail || 'https://via.placeholder.com/120x70';

                // Populate available formats
                const formatsList = document.getElementById('formatsList');
                formatsList.innerHTML = '';

                data.formats.forEach(f => {
                    const row = document.createElement('div');
                    row.className = 'format-row';
                    
                    const infoSpan = document.createElement('span');
                    infoSpan.innerText = `${f.ext.toUpperCase()} - ${f.resolution}`;

                    const downloadBtn = document.createElement('a');
                    downloadBtn.className = 'format-btn';
                    downloadBtn.innerText = 'Download';
                    // Hook this up to your downloader endpoint when ready
                    downloadBtn.href = '#'; 
                    downloadBtn.onclick = (e) => {
                        e.preventDefault();
                        alert(`Selected format ID: ${f.format_id} (${f.ext})`);
                    };

                    row.appendChild(infoSpan);
                    row.appendChild(downloadBtn);
                    formatsList.appendChild(row);
                });

                resultBox.style.display = 'block';

            } catch (err) {
                status.style.color = '#f87171';
                status.innerText = "Error: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
