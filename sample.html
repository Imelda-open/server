<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Player</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --surface-hover: #1f1f1f;
            --primary: #ffffff;
            --text-secondary: #b3b3b3;
            --border-color: #282828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Screen setup with black letterbox bars on left and right */
        body {
            background-color: #000000;
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Normal portrait box container - STRICT ZERO ROUNDED CORNERS */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-radius: 0 !important; /* Sharp corners on outer frame */
        }

        /* Sections */
        .section {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 140px;
        }

        .section.active {
            display: flex;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        /* Search Input */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--primary);
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }
        .search-box:focus {
            border-color: var(--primary);
        }

        /* Spotify-style Track List */
        .track-list {
            display: flex;
            flex-direction: column;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.15s ease;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
        }

        .track-item:hover {
            background-color: var(--surface-hover);
        }

        .track-thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            background-color: #1a1a1a;
            flex-shrink: 0;
            border-radius: 4px;
        }

        .track-info {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--primary);
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        .track-actions {
            display: flex;
            gap: 4px;
        }

        .track-action {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px 10px;
            font-size: 16px;
            font-weight: bold;
            transition: color 0.2s;
        }
        .track-action:hover {
            color: var(--primary);
        }

        /* Settings Section */
        .settings-group {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .settings-title {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .settings-value {
            font-size: 14px;
            font-weight: 500;
        }

        /* Now Playing Bar */
        .now-playing-bar {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            background-color: #121212;
            border-top: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .np-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            margin-right: 12px;
            background-color: #1a1a1a;
            border-radius: 4px;
        }
        .np-details {
            overflow: hidden;
            flex: 1;
            margin-right: 10px;
        }
        .np-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-status {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-controls button {
            background: var(--primary);
            color: var(--bg-color);
            border: none;
            width: 32px;
            height: 32px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border-radius: 50%;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--bg-color);
            display: flex;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
            transition: color 0.15s;
        }

        .nav-item.active {
            color: var(--primary);
            background-color: rgba(255, 255, 255, 0.03);
        }

        .nav-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        #ytAudioPlayer {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- LIBRARY SECTION -->
        <div id="section-library" class="section active">
            <h2>Library</h2>
            <div class="track-list" id="libraryList">
                <!-- Dynamically rendered -->
            </div>
        </div>

        <!-- SEARCH SECTION -->
        <div id="section-search" class="section">
            <h2>Search</h2>
            <input type="text" class="search-box" id="searchQuery" placeholder="Search YouTube Music..." onkeydown="if(event.key === 'Enter') handleSearch()">
            <div class="track-list" id="searchResultsList"></div>
        </div>

        <!-- SETTINGS SECTION -->
        <div id="section-settings" class="section">
            <h2>Settings</h2>
            <div class="settings-group">
                <div class="settings-title">API Server Connection</div>
                <div class="settings-value">http://192.168.1.15:3000</div>
            </div>
            <div class="settings-group">
                <div class="settings-title">Artwork Engine</div>
                <div class="settings-value">Apple Music Catalog Integration</div>
            </div>
            <div class="settings-group">
                <div class="settings-title">Frame Style</div>
                <div class="settings-value">Sharp Portrait Box</div>
            </div>
        </div>

        <!-- NOW PLAYING BAR -->
        <div class="now-playing-bar" id="nowPlayingBar" style="display: none;">
            <img id="npThumb" class="np-thumb" src="" alt="">
            <div class="np-details">
                <div class="np-title" id="npTitle">Song Title</div>
                <div class="np-status" id="npArtist">Artist Name</div>
            </div>
            <div class="np-controls">
                <button onclick="togglePlayState()">II</button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchSection('library', this)">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                <span>Library</span>
            </button>
            <button class="nav-item" onclick="switchSection('search', this)">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>Search</span>
            </button>
            <button class="nav-item" onclick="switchSection('settings', this)">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                <span>Settings</span>
            </button>
        </nav>

        <iframe id="ytAudioPlayer" src="" allow="autoplay"></iframe>

    </div>

    <script>
        const SERVER_URL = 'http://192.168.1.15:3000';
        
        let currentSearchResults = [];
        
        // Default songs pre-populated if library is empty
        const defaultTracks = [
            { videoId: 'jfKfPfyJRdk', name: 'Lofi Hip Hop Radio', artist: 'Lofi Girl', artwork: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/37/67/7f/37677f24-0370-13b9-1f48-03cd585e1975/artwork.jpg/300x300bb.jpg' },
            { videoId: '5qap5aO4i9A', name: 'Beats to Sleep/Chill to', artist: 'Lofi Girl', artwork: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/bf/2d/87/bf2d87a2-fa47-8a1a-4d74-56b9c93df382/artwork.jpg/300x300bb.jpg' },
            { videoId: 'TURbeWK-Z1o', name: 'Starboy', artist: 'The Weeknd', artwork: 'https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/b8/b6/22/b8b62235-94f7-7b89-a29d-47864f7b6d19/16UMGIM56687.rgb.jpg/300x300bb.jpg' }
        ];

        let librarySongs = JSON.parse(localStorage.getItem('yt_library'));
        if (!librarySongs || !Array.isArray(librarySongs) || librarySongs.length === 0) {
            librarySongs = defaultTracks;
            localStorage.setItem('yt_library', JSON.stringify(librarySongs));
        }

        window.onload = () => {
            renderLibrary();
        };

        function switchSection(sectionName, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(`section-${sectionName}`).classList.add('active');
            element.classList.add('active');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function fetchAppleMusicArt(title, artist) {
            try {
                const query = encodeURIComponent(`${title} ${artist}`);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
                }
            } catch (e) {
                console.error('Artwork fetch error:', e);
            }
            return 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80';
        }

        function renderLibrary() {
            const list = document.getElementById('libraryList');
            list.innerHTML = '';
            
            if (librarySongs.length === 0) {
                list.innerHTML = '<div style="color: var(--text-secondary); text-align: center; padding: 20px; font-size: 14px;">Your library is empty.</div>';
                return;
            }

            librarySongs.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'track-item';
                div.innerHTML = `
                    <img class="track-thumb" src="${song.artwork}" alt="">
                    <div class="track-info" onclick="playLibrarySong(${index})">
                        <div class="track-title">${escapeHtml(song.name)}</div>
                        <div class="track-artist">${escapeHtml(song.artist)}</div>
                    </div>
                    <div class="track-actions">
                        <button class="track-action" title="Remove" onclick="removeFromLibrary(event, ${index})">✕</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function handleSearch() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return;

            const resultsList = document.getElementById('searchResultsList');
            resultsList.innerHTML = '<div style="color: var(--text-secondary); padding: 20px; text-align: center; font-size: 14px;">Searching...</div>';

            try {
                const response = await fetch(`${SERVER_URL}/search?q=${encodeURIComponent(query)}`);
                const songs = await response.json();

                resultsList.innerHTML = '';
                currentSearchResults = [];

                if (!songs || songs.length === 0) {
                    resultsList.innerHTML = '<div style="color: var(--text-secondary); padding: 20px; text-align: center; font-size: 14px;">No results found.</div>';
                    return;
                }

                songs.forEach((song, i) => {
                    const songObj = {
                        videoId: song.videoId,
                        name: song.name,
                        artist: song.artist?.name || 'Unknown',
                        artwork: 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80'
                    };
                    currentSearchResults.push(songObj);

                    const div = document.createElement('div');
                    div.className = 'track-item';
                    div.innerHTML = `
                        <img class="track-thumb" id="search-thumb-${i}" src="${songObj.artwork}" alt="">
                        <div class="track-info" onclick="playSearchResult(${i})">
                            <div class="track-title">${escapeHtml(songObj.name)}</div>
                            <div class="track-artist">${escapeHtml(songObj.artist)}</div>
                        </div>
                        <div class="track-actions">
                            <button class="track-action" title="Add to Library" onclick="addToLibrary(event, ${i})">+</button>
                        </div>
                    `;
                    resultsList.appendChild(div);

                    // Fetch Apple Music Artwork asynchronously
                    fetchAppleMusicArt(songObj.name, songObj.artist).then(artUrl => {
                        songObj.artwork = artUrl;
                        const imgElem = document.getElementById(`search-thumb-${i}`);
                        if (imgElem) imgElem.src = artUrl;
                    });
                });
            } catch (err) {
                resultsList.innerHTML = '<div style="color: var(--text-secondary); padding: 20px; text-align: center; font-size: 14px;">Error connecting to Termux API.</div>';
                console.error(err);
            }
        }

        function addToLibrary(event, index) {
            event.stopPropagation();
            const song = currentSearchResults[index];
            if (!song) return;

            if (!librarySongs.some(s => s.videoId === song.videoId)) {
                librarySongs.push({...song});
                localStorage.setItem('yt_library', JSON.stringify(librarySongs));
                renderLibrary();
                alert(`Added "${song.name}" to your Library!`);
            } else {
                alert('Song is already in your library.');
            }
        }

        function removeFromLibrary(event, index) {
            event.stopPropagation();
            librarySongs.splice(index, 1);
            localStorage.setItem('yt_library', JSON.stringify(librarySongs));
            renderLibrary();
        }

        function playLibrarySong(index) {
            const song = librarySongs[index];
            if (song) playSong(song.videoId, song.name, song.artist, song.artwork);
        }

        function playSearchResult(index) {
            const song = currentSearchResults[index];
            if (song) playSong(song.videoId, song.name, song.artist, song.artwork);
        }

        function playSong(videoId, title, artist, artwork) {
            document.getElementById('nowPlayingBar').style.display = 'flex';
            document.getElementById('npTitle').textContent = title;
            document.getElementById('npArtist').textContent = artist;
            document.getElementById('npThumb').src = artwork;
            
            const player = document.getElementById('ytAudioPlayer');
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        }

        function togglePlayState() {
            const player = document.getElementById('ytAudioPlayer');
            if (player.src) {
                player.src = '';
                document.getElementById('npArtist').textContent = 'Paused';
            }
        }
    </script>
</body>
</html>
