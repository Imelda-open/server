<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material U Black & White UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      max-width: 450px;
      max-height: 900px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    .content-area {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
      position: relative;
    }

    .section {
      display: none;
      opacity: 0;
      transition: opacity 0.1s ease-in-out;
    }

    .section.active {
      display: block;
      opacity: 1;
    }

    .section-header {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background-color: #1a1a1a;
      border: 1px solid #282828;
      color: #fff;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }

    .grid-card {
      background-color: #1a1a1a;
      border: 1px solid #282828;
      border-radius: 12px;
      display: flex;
      align-items: center;
      overflow: hidden;
      height: 56px;
      position: relative;
    }

    .grid-card-img {
      width: 56px;
      height: 56px;
      background-color: #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .grid-card-img svg {
      width: 24px;
      height: 24px;
      fill: #888;
    }

    .grid-card span {
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0 10px;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dot-blue {
      width: 6px;
      height: 6px;
      background-color: #fff;
      border-radius: 50%;
      position: absolute;
      right: 10px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    .songs-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 28px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #121212;
      border: 1px solid #1f1f1f;
      padding: 10px 12px;
      border-radius: 12px;
    }

    .song-img {
      width: 44px;
      height: 44px;
      background-color: #262626;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .song-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .song-img svg {
      width: 20px;
      height: 20px;
      fill: #888;
    }

    .song-info {
      flex: 1;
      overflow: hidden;
    }

    .song-title {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.78rem;
      color: #888;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .horizontal-scroll::-webkit-scrollbar {
      display: none;
    }

    .scroll-card {
      width: 130px;
      flex-shrink: 0;
    }

    .scroll-card .img-box {
      width: 130px;
      height: 130px;
      background-color: #1a1a1a;
      border: 1px solid #282828;
      border-radius: 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scroll-card .img-box svg {
      width: 32px;
      height: 32px;
      fill: #888;
    }

    .scroll-card p {
      font-size: 0.8rem;
      color: #888;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-bar {
      background-color: #1a1a1a;
      border: 1px solid #282828;
      border-radius: 28px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .search-bar svg {
      width: 20px;
      height: 20px;
      fill: #888;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      width: 100%;
    }

    .search-bar input::placeholder {
      color: #888;
    }

    .card {
      background-color: #1a1a1a;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid #282828;
    }

    .card-text h3 {
      font-size: 1rem;
      font-weight: 500;
    }

    .card-text p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 2px;
    }

    .search-results {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-search {
      color: #888;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 24px;
    }

    .switch-card {
      justify-content: space-between;
    }

    .toggle {
      width: 52px;
      height: 32px;
      background-color: #2b2b2b;
      border-radius: 16px;
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #888;
      top: 4px;
      left: 4px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .toggle.active {
      background-color: #fff;
    }

    .toggle.active::after {
      transform: translateX(20px);
      background-color: #000;
    }

    .bottom-nav {
      height: 80px;
      background-color: #0d0d0d;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 8px;
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 33.33%;
    }

    .indicator {
      width: 64px;
      height: 32px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .indicator svg {
      width: 22px;
      height: 22px;
      fill: #888;
      transition: fill 0.2s;
    }

    .nav-btn label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-btn.active .indicator {
      background-color: #fff;
    }

    .nav-btn.active .indicator svg {
      fill: #000;
    }

    .nav-btn.active label {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="content-area">
      
      <!-- LIBRARY SECTION -->
      <section id="library" class="section active">
        <h1 class="section-header">Library</h1>

        <div class="filter-chips">
          <div class="chip">Music</div>
          <div class="chip">Podcasts & Shows</div>
          <div class="chip">Audiobooks</div>
        </div>

        <div class="grid-container">
          <div class="grid-card">
            <div class="grid-card-img"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5z"/></svg></div>
            <span>Favorites</span>
          </div>
          <div class="grid-card">
            <div class="grid-card-img"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5z"/></svg></div>
            <span>Recently Added</span>
          </div>
          <div class="grid-card">
            <div class="grid-card-img"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5z"/></svg></div>
            <span>Daily Mix 1</span>
          </div>
          <div class="grid-card">
            <div class="grid-card-img"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5z"/></svg></div>
            <span>Downloads</span>
            <div class="dot-blue"></div>
          </div>
        </div>

        <h2 class="section-title">Your Songs</h2>
        <div class="songs-list" id="library-song-list">
          <div class="empty-search">Loading songs...</div>
        </div>

        <h2 class="section-title">Jump back in</h2>
        <div class="horizontal-scroll">
          <div class="scroll-card">
            <div class="img-box">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            </div>
            <p>Recent Stream</p>
          </div>
          <div class="scroll-card">
            <div class="img-box">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            </div>
            <p>Daily Mix 3</p>
          </div>
        </div>
      </section>

      <!-- SEARCH SECTION -->
      <section id="search" class="section">
        <h1 class="section-header">Search</h1>
        
        <div class="search-bar">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="Search songs or artists..." oninput="handleSearch()">
        </div>

        <div class="search-results" id="search-results-container">
          <div class="card">
            <div class="card-text">
              <h3>Type to search</h3>
              <p>Fetching from 192.168.1.15</p>
            </div>
          </div>
        </div>
      </section>

      <!-- SETTINGS SECTION -->
      <section id="settings" class="section">
        <h1 class="section-header">Settings</h1>

        <div class="card switch-card">
          <div class="card-text">
            <h3>Dark Mode</h3>
            <p>High contrast theme active</p>
          </div>
          <div class="toggle active" onclick="this.classList.toggle('active')"></div>
        </div>

        <div class="card switch-card">
          <div class="card-text">
            <h3>Notifications</h3>
            <p>Enable system alerts</p>
          </div>
          <div class="toggle" onclick="this.classList.toggle('active')"></div>
        </div>
      </section>

    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="showSection('library', this)">
        <div class="indicator">
          <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        </div>
        <label>LIBRARY</label>
      </button>

      <button class="nav-btn" onclick="showSection('search', this)">
        <div class="indicator">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <label>SEARCH</label>
      </button>

      <button class="nav-btn" onclick="showSection('settings', this)">
        <div class="indicator">
          <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
        </div>
        <label>SETTINGS</label>
      </button>
    </nav>
  </div>

  <script>
    // Server Endpoints on local IP 192.168.1.15
    const API_URLS = {
      GET_SONGS: 'http://192.168.1.15:3000/api/songs',
      SEARCH_SONGS: 'http://192.168.1.15:3000/api/songs/search?q='
    };

    let isAnimating = false;
    let searchDebounceTimeout = null;

    function createSongItemHTML(song) {
      const title = song.title || song.name || 'Unknown Title';
      const artist = song.artist || song.artistName || 'Unknown Artist';
      const cover = song.coverUrl || song.artwork || null;

      return `
        <div class="song-item">
          <div class="song-img">
            ${cover 
              ? `<img src="${cover}" alt="cover" onerror="this.remove()">` 
              : `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`
            }
          </div>
          <div class="song-info">
            <div class="song-title">${title}</div>
            <div class="song-artist">${artist}</div>
          </div>
        </div>
      `;
    }

    async function fetchLibrarySongs() {
      const container = document.getElementById('library-song-list');
      try {
        const response = await fetch(API_URLS.GET_SONGS);
        if (!response.ok) throw new Error('Network response error');
        
        const songs = await response.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          container.innerHTML = `<div class="empty-search">No songs found on server</div>`;
          return;
        }

        container.innerHTML = songs.map(createSongItemHTML).join('');
      } catch (err) {
        console.error('Failed to fetch library songs:', err);
        container.innerHTML = `<div class="empty-search">Unable to load songs from 192.168.1.15</div>`;
      }
    }

    function handleSearch() {
      clearTimeout(searchDebounceTimeout);
      const query = document.getElementById('search-input').value.trim();
      const resultsContainer = document.getElementById('search-results-container');

      if (!query) {
        resultsContainer.innerHTML = `
          <div class="card">
            <div class="card-text">
              <h3>Type to search</h3>
              <p>Fetching from 192.168.1.15</p>
            </div>
          </div>
        `;
        return;
      }

      searchDebounceTimeout = setTimeout(async () => {
        try {
          const response = await fetch(`${API_URLS.SEARCH_SONGS}${encodeURIComponent(query)}`);
          if (!response.ok) throw new Error('Search request failed');

          const results = await response.json();

          if (!Array.isArray(results) || results.length === 0) {
            resultsContainer.innerHTML = `<div class="empty-search">No matching songs found</div>`;
            return;
          }

          resultsContainer.innerHTML = results.map(createSongItemHTML).join('');
        } catch (err) {
          console.error('Search API error:', err);
          resultsContainer.innerHTML = `<div class="empty-search">Error reaching 192.168.1.15</div>`;
        }
      }, 250);
    }

    function showSection(sectionId, btnElement) {
      const currentSection = document.querySelector('.section.active');
      const targetSection = document.getElementById(sectionId);

      if (currentSection === targetSection || isAnimating) return;

      isAnimating = true;

      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (currentSection) {
        currentSection.style.opacity = '0';
        
        setTimeout(() => {
          currentSection.classList.remove('active');
          currentSection.style.display = 'none';

          targetSection.style.display = 'block';
          document.querySelector('.content-area').scrollTop = 0;
          
          void targetSection.offsetWidth;
          
          targetSection.classList.add('active');
          targetSection.style.opacity = '1';

          setTimeout(() => {
            isAnimating = false;
          }, 100);
        }, 50);
      } else {
        targetSection.style.display = 'block';
        targetSection.classList.add('active');
        targetSection.style.opacity = '1';
        isAnimating = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchLibrarySongs();
    });
  </script>

</body>
</html>
