<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            word-break: break-word;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }
        .result-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .download-side-btn {
            background-color: #22c55e;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background-color 0.2s;
        }
        .download-side-btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Video Downloader</h2>
        <form id="downloadForm" onsubmit="startDownload(event)">
            <input type="text" id="urlInput" placeholder="Paste link here..." autocomplete="off">
            <button type="submit" id="downloadBtn">Find Video</button>
        </form>
        <p id="status"></p>

        <!-- Video found container with download button on the right -->
        <div id="resultBox" class="result-box">
            <div class="result-info" id="videoTitle">Video Ready</div>
            <a id="downloadLink" href="#" class="download-side-btn" download>Download</a>
        </div>
    </div>

    <script>
        async function startDownload(event) {
            event.preventDefault();

            const urlInput = document.getElementById('urlInput');
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultBox = document.getElementById('resultBox');
            const videoTitle = document.getElementById('videoTitle');
            const downloadLink = document.getElementById('downloadLink');
            
            const url = urlInput.value.trim();

            if (!url) {
                status.style.color = '#f87171';
                status.innerText = "Please paste a valid URL first.";
                resultBox.style.display = 'none';
                return;
            }

            downloadBtn.disabled = true;
            status.style.color = '#38bdf8';
            status.innerText = "Processing on server...";
            resultBox.style.display = 'none';

            try {
                const apiUrl = 'https://gregory-edward-gibson-flash.trycloudflare.com/api/download';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    status.style.color = '#4ade80';
                    status.innerText = "Video found successfully!";
                    
                    // Show the result box with download button on the right
                    videoTitle.innerText = "Downloaded Video File";
                    downloadLink.href = "#"; // Replace with actual file stream URL if your backend serves it
                    resultBox.style.display = 'flex';
                } else {
                    status.style.color = '#f87171';
                    status.innerText = "Error: " + (data.error || "Failed to find video.");
                }
            } catch (err) {
                status.style.color = '#f87171';
                status.innerText = "Failed to connect to the backend server.";
                console.error(err);
            } finally {
                downloadBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
