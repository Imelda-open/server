<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Toggle</title>
    <style>
        /* Make the container fill the screen normally until toggled */
        #fullscreen-container {
            width: 100vw;
            height: 100vh;
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="fullscreen-container">
        Click anywhere to toggle fullscreen
    </div>

    <script>
        const container = document.getElementById('fullscreen-container');

        container.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // Enter fullscreen
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { // Safari support
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { // IE/Edge support
                    container.msRequestFullscreen();
                }
            } else {
                // Exit fullscreen if already in it
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });
    </script>

</body>
</html>
