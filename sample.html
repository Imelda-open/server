<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music Player</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --surface-hover: #1e1e1e;
            --primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Enforce portrait framing with black letterboxing bars */
        body {
            background-color: #050505;
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Portrait Container locked inside black bars */
        .app-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 900px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        }

        @media (min-width: 421px) {
            .app-frame {
                height: 92vh;
                border-radius: 24px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        /* App Container Layout */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Sections */
        .section {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 130px;
        }

        .section.active {
            display: flex;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Search Input */
        .search-box {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            color: var(--primary);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }
        .search-box:focus {
            border-color: var(--primary);
        }

        /* Track Lists */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 12px;
        }

        .track-item:hover {
            background-color: var(--surface-hover);
        }

        .track-thumb {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #222;
            flex-shrink: 0;
        }

        .track-info {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .track-actions {
            display: flex;
            gap: 4px;
        }

        .track-action {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            font-size: 14px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }
        .track-action:hover {
            color: var(--primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Settings Section */
        .settings-group {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .settings-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .settings-value {
            font-size: 15px;
            font-weight: 500;
        }

        /* Now Playing Bar */
        .now-playing-bar {
            position: absolute;
            bottom: 75px;
            left: 16px;
            right: 16px;
            background-color: rgba(24, 24, 24, 0.95);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }
        .np-thumb {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 10px;
            background-color: #222;
        }
        .np-details {
            overflow: hidden;
            flex: 1;
            margin-right: 10px;
        }
        .np-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-status {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .np-controls button {
            background: var(--primary);
            color: var(--bg-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 33.33%;
            height: 100%;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-pill {
            padding: 6px 18px;
            border-radius: 18px;
            transition: background-color 0.2s;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .nav-item.active .nav-pill {
            background-color: var(--accent-bg);
        }

        /* SVG Icons */
        .nav-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        #ytAudioPlayer {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-frame">
        <div class="app-container">
            
            <!-- LIBRARY SECTION -->
            <div id="section-library" class="section active">
                <h2>Library</h2>
                <div class="track-list" id="libraryList">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- SEARCH SECTION -->
            <div id="section-search" class="section">
                <h2>Search</h2>
                <input type="text" class="search-box" id="searchQuery" placeholder="Search YouTube Music..." onkeydown="if(event.key === 'Enter') searchSongs()">
                <div class="track-list" id="searchResultsList"></div>
            </div>

            <!-- SETTINGS SECTION -->
            <div id="section-settings" class="section">
                <h2>Settings</h2>
                <div class="settings-group">
                    <div class="settings-title">API Server Connection</div>
                    <div class="settings-value">http://192.168.1.15:3000</div>
                </div>
                <div class="settings-group">
                    <div class="settings-title">Artwork Provider</div>
                    <div class="settings-value">Apple Music API Catalog</div>
                </div>
                <div class="settings-group">
                    <div class="settings-title">Display Mode</div>
                    <div class="settings-value">Locked Portrait Frame</div>
                </div>
            </div>

            <!-- NOW PLAYING BAR -->
            <div class="now-playing-bar" id="nowPlayingBar" style="display: none;">
                <img id="npThumb" class="np-thumb" src="" alt="">
                <div class="np-details">
                    <div class="np-title" id="npTitle">Song Title</div>
                    <div class="np-status" id="npArtist">Artist Name</div>
                </div>
                <div class="np-controls">
                    <button onclick="togglePlayState()">II</button>
                </div>
            </div>

            <!-- BOTTOM NAVIGATION (Clean SVG Icons) -->
            <nav class="bottom-nav">
                <button class="nav-item active" onclick="switchSection('library', this)">
                    <div class="nav-pill">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                        <span>Library</span>
                    </div>
                </button>
                <button class="nav-item" onclick="switchSection('search', this)">
                    <div class="nav-pill">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <span>Search</span>
                    </div>
                </button>
                <button class="nav-item" onclick="switchSection('settings', this)">
                    <div class="nav-pill">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        <span>Settings</span>
                    </div>
                </button>
            </nav>

            <iframe id="ytAudioPlayer" src="" allow="autoplay"></iframe>

        </div>
    </div>

    <script>
        const SERVER_URL = 'http://192.168.1.15:3000';
        
        let librarySongs = JSON.parse(localStorage.getItem('yt_library')) || [
            { videoId: 'jfKfPfyJRdk', name: 'Lofi hip hop radio - beats to study/relax to', artist: 'Lofi Girl', artwork: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/37/67/7f/37677f24-0370-13b9-1f48-03cd585e1975/artwork.jpg/300x300bb.jpg' }
        ];

        window.onload = () => {
            renderLibrary();
        };

        function switchSection(sectionName, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(`section-${sectionName}`).classList.add('active');
            element.classList.add('active');
        }

        // Fetch artwork dynamically using Apple Music public search API
        async function fetchAppleMusicArt(title, artist) {
            try {
                const query = encodeURIComponent(`${title} ${artist}`);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    // Swap template resolution to 300x300 high quality image
                    return data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
                }
            } catch (e) {
                console.error('Artwork fetch error:', e);
            }
            return 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80'; // fallback
        }

        function renderLibrary() {
            const list = document.getElementById('libraryList');
            list.innerHTML = '';
            if (librarySongs.length === 0) {
                list.innerHTML = '<div style="color: var(--text-secondary); text-align: center; padding: 20px; font-size: 14px;">Your library is empty. Search and add tracks!</div>';
                return;
            }

            librarySongs.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'track-item';
                div.innerHTML = `
                    <img class="track-thumb" src="${song.artwork}" alt="">
                    <div class="track-info" onclick="playSong('${song.videoId}', '${song.name.replace(/'/g, "\\'")}', '${song.artist.replace(/'/g, "\\'")}', '${song.artwork}')">
                        <div class="track-title">${song.name}</div>
                        <div class="track-artist">${song.artist}</div>
                    </div>
                    <div class="track-actions">
                        <button class="track-action" title="Remove" onclick="removeFromLibrary(${index})">✕</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function searchSongs() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return;

            const resultsList = document.getElementById('searchResultsList');
            resultsList.innerHTML = '<div style="color: var(--text-secondary); padding: 20px; text-align: center; font-size: 14px;">Searching...</div>';

            try {
                const response = await fetch(`${SERVER_URL}/search?q=${encodeURIComponent(query)}`);
                const songs = await response.json();

                resultsList.innerHTML = '';
                if (songs.length === 0) {
                    resultsList.innerHTML = '<div style="color: var(--text-secondary); padding: 20px; text-align: center; font-size: 14px;">No results found.</div>';
                    return;
                }

                for (let i = 0; i < songs.length; i++) {
                    const song = songs[i];
                    const songName = song.name;
                    const artistName = song.artist?.name || 'Unknown';
                    
                    // Fetch Apple Music Art matching search item
                    const artworkUrl = await fetchAppleMusicArt(songName, artistName);

                    const div = document.createElement('div');
                    div.className = 'track-item';
                    div.innerHTML = `
                        <img class="track-thumb" src="${artworkUrl}" alt="">
                        <div class="track-info" onclick="playSong('${song.videoId}', '${songName.replace(/'/g, "\\'")}', '${artistName.replace(/'/g, "\\'")}', '${artworkUrl}')">
                            <div class="track-title">${songName}</div>
                            <div class="track-artist">${artistName}</div>
                        </div>
                        <div class="track-actions">
                            <button class="track-action" title="Add to Library" onclick='addToLibrary({videoId: "${song.videoId}", name: "${songName.replace(/'/g, "\\'")}", artist: "${artistName.replace(/'/g, "\\'")}", artwork: "${artworkUrl}"})'>+</button>
                        </div>
                    `;
                    resultsList.appendChild(div);
                }
            } catch (err) {
                resultsList.innerHTML = '<div style="color: var(--text-secondary); padding: 20px; text-align: center; font-size: 14px;">Error connecting to Termux API.</div>';
                console.error(err);
            }
        }

        function addToLibrary(song) {
            if (!librarySongs.some(s => s.videoId === song.videoId)) {
                librarySongs.push(song);
                localStorage.setItem('yt_library', JSON.stringify(librarySongs));
                renderLibrary();
            } else {
                alert('Song is already in your library.');
            }
        }

        function removeFromLibrary(index) {
            librarySongs.splice(index, 1);
            localStorage.setItem('yt_library', JSON.stringify(librarySongs));
            renderLibrary();
        }

        function playSong(videoId, title, artist, artwork) {
            document.getElementById('nowPlayingBar').style.display = 'flex';
            document.getElementById('npTitle').textContent = title;
            document.getElementById('npArtist').textContent = artist;
            document.getElementById('npThumb').src = artwork;
            
            const player = document.getElementById('ytAudioPlayer');
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        }

        function togglePlayState() {
            const player = document.getElementById('ytAudioPlayer');
            if (player.src) {
                player.src = '';
                document.getElementById('npStatus').textContent = 'Paused';
            }
        }
    </script>
</body>
</html>
